# Render's free tier sleeps a service after 15 minutes idle. Waking the Fable
# API measured 31.6s cold, during which the marketplace renders with no books
# — the client is on Vercel and loads instantly, so the page looks broken
# rather than slow.
#
# Budget: the free plan allows 750 instance-hours a month ACROSS THE ACCOUNT,
# and this account also runs the Wanderly API. A service pinged every 10
# minutes stays up for the whole window, so:
#
#   24h/day x 31 x 2 services = 1488h  -> blows the quota, services suspended
#   10h/day x 31 x 2 services =  620h  -> fits, with ~130h to spare
#
# Keep this window in step with the matching workflow in
# atiqahmedreza/wanderly-travel-agency; widening one alone eats the shared
# headroom.
name: Keep API awake

on:
  schedule:
    # Every 10 minutes, 04:00-13:59 UTC = 10:00-19:59 Bangladesh (UTC+6).
    - cron: "*/10 4-13 * * *"
  workflow_dispatch:

concurrency:
  group: keep-api-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping the API until it answers
        run: |
          # /api/ebooks rather than /api/health: this also warms the Mongo
          # connection, which is what the catalogue actually waits on.
          URL="https://fable-server-ldwp.onrender.com/api/ebooks"
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$URL" || echo "000")
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "API is awake."
              exit 0
            fi
            sleep 20
          done
          echo "::error::API did not return 200 after 3 attempts — it may be down."
          exit 1
